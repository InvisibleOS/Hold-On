# One-click deploy: https://render.com/deploy?repo=<your-repo-url>
services:
  - type: web
    name: holdon
    runtime: node
    plan: starter # always on: no cold start when a judge opens the link
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PUBLIC_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SCAMMER_CLIENT_ID
        sync: false
      - key: SCAMMER_CLIENT_SECRET
        sync: false
      - key: ROSE_EMAIL
        sync: false
      - key: ROSE_VAULT_ID
        sync: false
      - key: JAKE_EMAIL
        sync: false
      - key: JAKE_VENMO_PHONE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: AG_STUDIO_LICENSE
        sync: false
      - key: APP_SECRET
        generateValue: true
